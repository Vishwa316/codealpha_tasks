# ============================================================
# GitHub Actions Workflow: Gradle Build & Test
# Code Alpha Internship — Java Application using Gradle
# ============================================================
#
# This workflow automatically builds and tests the Java app
# on every push or pull request to the main branch.
# It demonstrates CI/CD integration with Gradle builds.
# ============================================================

name: "Java CI with Gradle"

# Trigger: Run on any push or pull request targeting 'main'
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Cancel any in-progress run for the same branch (saves CI minutes)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: "Build & Test (Java ${{ matrix.java-version }})"
    runs-on: ubuntu-latest

    # Matrix strategy: test on multiple Java versions for compatibility
    strategy:
      matrix:
        java-version: ['21']

    steps:
      # Step 1: Checkout the repository source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # Step 2: Set up the specified JDK version from the matrix
      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'  # Eclipse Temurin (formerly AdoptOpenJDK)

      # Step 3: Setup Gradle (automatically handles caching, wrapper permissions, and execution)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Step 4: Run Gradle build, tests, and application tasks
      - name: Execute Gradle build
        working-directory: java-gradle-app
        run: ./gradlew build test run projectInfo --no-daemon --no-configuration-cache

      # Step 9: Upload test reports as downloadable artifacts for review
      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()  # Upload even if tests fail, so we can debug
        with:
          name: test-report-java-${{ matrix.java-version }}
          path: java-gradle-app/app/build/reports/tests/test/
          retention-days: 14
